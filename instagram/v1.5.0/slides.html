<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>PG Soundings 1.5.0 slides</title>
<!--
  Visuels Instagram des nouveautés de PG Soundings depuis la 1.2.5 (versions 1.2.6 à 1.5.0). Une diapo par adresse :
    slides.html?s=1..3&f=post   → carrousel 1080 × 1350
    slides.html?s=1..3&f=story  → story 1080 × 1920
  Captures du plugin en largeur de téléphone (450 px, rendu 3× ; émagramme : 560 px), prévisions réelles :
    assets/thermiques-standre.png  graphique GFS du 27/09 à Saint-André-les-Alpes (journée thermique)
    assets/orage-doussard.png      graphique GFS du 04/10 à Doussard (orage probable, nuages de pluie)
    assets/bulletin-standre.png    bulletin GFS du 27/09 à Saint-André-les-Alpes
    assets/emagramme-standre.png   émagramme GFS du 27/09 à 11 h à Saint-André-les-Alpes
-->
<style>
  :root { --bg1: #3b2a6b; --bg2: #16202c; --bg3: #0d141c; --fg: #eef2f7; --dim: #b5bfcc; --accent: #ffd24a; }
  html, body { margin: 0; }
  body { font-family: 'Segoe UI', Roboto, Arial, sans-serif; color: var(--fg); overflow: hidden;
    background: radial-gradient(circle at 15% 0%, var(--bg1) 0%, var(--bg2) 48%, var(--bg3) 100%); }
  .page { position: relative; width: 1080px; box-sizing: border-box; padding: 64px 70px 0; }
  .post { height: 1350px; }
  .story { height: 1920px; padding-top: 190px; }
  .tag { display: inline-block; padding: 8px 18px; border-radius: 30px; background: var(--accent); color: #111;
    font-weight: 800; font-size: 24px; letter-spacing: .5px; }
  .num { position: absolute; top: 64px; right: 70px; font-size: 26px; color: var(--dim); font-weight: 600; }
  .story .num { top: 190px; }
  h2 { margin: 22px 0 10px; font-size: 62px; line-height: 1.08; letter-spacing: -1px; }
  h2 em { font-style: normal; color: var(--accent); }
  .card { border-radius: 22px; overflow: hidden; box-shadow: 0 30px 70px rgba(0,0,0,.6); border: 2px solid rgba(255,255,255,.12);
    background: #2b2b2b; position: relative; margin-top: 28px; }
  .crop { position: relative; overflow: hidden; }
  .crop img { position: absolute; display: block; }
  .cut { height: 0; border-top: 3px dashed rgba(255,255,255,.22); }
  ul.points { list-style: none; padding: 0; margin: 30px 0 0; font-size: 31px; line-height: 1.35; }
  ul.points li { margin: 0 0 12px; }
  ul.points li::before { content: '✓ '; color: var(--accent); font-weight: 800; }
  ul.points b { color: #fff; }
  .foot { position: absolute; bottom: 44px; left: 70px; right: 70px; display: flex; justify-content: space-between;
    font-size: 25px; color: #8f9bab; }
  .story .foot { bottom: 250px; }
  .foot b { color: var(--accent); }
</style>
</head>
<body>
<script>
  const q = new URLSearchParams(location.search);
  const S = Number(q.get('s') || 1);
  const F = q.get('f') === 'story' ? 'story' : 'post';
  const story = F === 'story';
  const N = 3;
  const W = 940;

  // Bande horizontale d'une capture (y et h en px de la capture), affichée sur toute la largeur de la carte
  const band = (name, y, h, w = 1410) => {
    const k = W / w;
    return `<div class="crop" style="width:${W}px;height:${Math.round(h * k)}px"><img src="assets/${name}.png"
      style="left:0;top:${-y * k}px;transform-origin:0 0;transform:scale(${k})"></div>`;
  };
  const card = (...bands) => `<div class="card">${bands.join('<div class="cut"></div>')}</div>`;
  const num = `<div class="num">${S} / ${N}</div>`;
  const foot = `<div class="foot"><span>Plugin gratuit pour <b>Windy.com</b></span><span>PG Soundings 🪂</span></div>`;

  const slides = {
    1: () => `${num}
      <div class="tag">DEPUIS LA 1.2.5 · THERMIQUES</div>
      <h2>Les <em>thermiques</em> au vario</h2>
      ${card(band('thermiques-standre', story ? 505 : 664, story ? 1145 : 986), band('thermiques-standre', 1830, 255))}
      <ul class="points">
        <li>Ascendances en <b>montée au vario</b>, plafond <b>exploitable</b></li>
        <li>Bandeau « <b>Therm.</b> » : faciles, faibles, hachés par le vent</li>
        <li><b>Heure par heure</b> même sans Windy Premium</li>
        ${story ? '<li>Jusqu\'à <b>15 jours</b> de prévision avec Windy Premium, 7 sans</li>' : ''}
      </ul>`,
    2: () => `${num}
      <div class="tag">DEPUIS LA 1.2.5 · ORAGES ET PLUIE</div>
      <h2><em>Orages</em>, nuages et pluie</h2>
      ${story
        ? card(band('orage-doussard', 345, 235), band('orage-doussard', 766, 1064), band('orage-doussard', 2072, 250))
        : card(band('orage-doussard', 814, 876), band('orage-doussard', 2072, 250))}
      <ul class="points">
        <li><b>Risque d'orage</b> heure par heure et alerte du jour</li>
        <li><b>CAPE et LI</b> heure par heure, <b>nuage gris</b> à chaque pluie</li>
        <li>Averses ou pluie de front, <b>neige</b> distinguée de la pluie</li>
      </ul>`,
    3: () => `${num}
      <div class="tag">DEPUIS LA 1.2.5 · BULLETIN</div>
      <h2>Le <em>bulletin</em> et la particule</h2>
      ${story
        ? card(band('bulletin-standre', 470, 830), band('emagramme-standre', 1300, 920, 1740))
        : card(band('bulletin-standre', 470, 540), band('emagramme-standre', 1330, 880, 1740))}
      <ul class="points">
        <li><b>Bulletin</b> : conditions heure par heure, créneaux, fronts, ciel</li>
        <li><b>Émagramme</b> : ascension de la particule, heure au pas de 5 min</li>
        <li>Un aperçu des <b>jours suivants</b>, cliquables</li>
      </ul>`,
  };

  document.body.innerHTML = `<div class="page ${F}">${slides[S]()}${foot}</div>`;
</script>
</body>
</html>
