# Page de présentation du plugin (scripts/site-page.mjs), refaite et publiée sur GitHub Pages à
# chaque envoi sur main. Elle se relance aussi à la main : onglet « Actions » → « Page du site » →
# « Run workflow ».
#
# À régler une fois dans le dépôt : Settings → Pages → Source « GitHub Actions », puis le
# sous-domaine dans « Custom domain ».
name: Page du site

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

# Une seule publication à la fois ; celle qui est en cours va au bout
concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    publier:
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.publication.outputs.page_url }}
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
            - id: pages
              uses: actions/configure-pages@v6
            # L'adresse publique de la page (le sous-domaine, une fois réglé) sert aux aperçus de lien
            - run: node scripts/site-page.mjs
              env:
                  SITE_URL: ${{ steps.pages.outputs.base_url }}
            - uses: actions/upload-pages-artifact@v5
              with:
                  path: site
            - id: publication
              uses: actions/deploy-pages@v5
